<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>特定工廠登記｜蘇杭開發顧問有限公司</title>
<meta name="description" content="整理申請文件、追蹤補正及主管機關審查進度。">
<style>
:root{--paper:#f4efe5;--paper2:#eae2d4;--ink:#24362f;--muted:#536158;--accent:#a85e39;--line:#cfc4b3;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.85}
a{color:inherit;text-decoration:none}.wrap{width:min(1040px,92%);margin:auto}
.top{border-bottom:1px solid var(--line);background:rgba(244,239,229,.96);position:sticky;top:0}
.nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-weight:900;letter-spacing:.08em}.back{border:1px solid var(--ink);padding:9px 14px;font-size:14px}
.hero{padding:82px 0 46px}.kicker{font-size:12px;color:var(--accent);font-weight:900;letter-spacing:.18em}
h1{font-family:"Noto Serif TC","PMingLiU",serif;font-size:clamp(38px,5vw,64px);line-height:1.18;margin:10px 0 18px}
.lead{font-size:18px;color:var(--muted);max-width:760px}
.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:34px;padding:24px 0 84px}
.panel{border:1px solid var(--line);background:rgba(255,253,248,.48);padding:30px}
.panel h2{font-family:"Noto Serif TC","PMingLiU",serif;margin:0 0 18px;font-size:28px}
.steps{display:grid;gap:12px}.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.step b{color:var(--accent)}.note{font-size:13px;color:var(--muted);margin-top:22px}
.cta{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--ink);padding:11px 17px;font-weight:800}.btn.primary{background:var(--ink);color:var(--white)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding-top:54px}.panel{padding:22px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav">
<a class="brand" href="../index.html">蘇杭開發顧問有限公司</a>
<a class="back" href="../index.html#services">← 回服務項目</a>
</div></header>
<main>
<section class="wrap hero">
<div class="kicker">SERVICE 08</div>
<h1>特定工廠登記</h1>
<p class="lead">完成前階段改善後，協助整理特定工廠登記申請資料並追蹤審查及補正。</p>
</section>
<section class="wrap grid">
<div class="panel">
<h2>服務說明</h2>
<p>整理申請文件、追蹤補正及主管機關審查進度。</p>
<p class="note">實際辦理項目、文件與程序依個案條件及主管機關審查結果辦理。</p>
<div class="cta">
<a class="btn primary" href="../index.html#inquiry">填寫案件諮詢</a>
<a class="btn" href="../index.html#contact">聯絡我們</a>
</div>
</div>
<div class="panel">
<h2>我們可協助的內容</h2>
<div class="steps"><div class="step"><b>01</b><div>特定工廠登記文件整理</div></div><div class="step"><b>02</b><div>申請資料檢核</div></div><div class="step"><b>03</b><div>補正事項追蹤</div></div><div class="step"><b>04</b><div>主管機關審查進度掌握</div></div></div>
</div>
</section>
</main>
</body>
</html>
